<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOPORTAL - Análise Espacial Dinâmica</title>
    
    <!-- Fonte Google: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary: #4ade80; 
            --primary-hover: #22c55e;
            --bg-dark: rgba(15, 23, 20, 0.95);
            --bg-card: rgba(30, 41, 35, 0.95);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --elegivel: #10b981;
            --inelegivel: #ef4444;
            --border-color: rgba(255,255,255,0.1);
        }

        /* Variáveis do Modo Claro */
        body.light-mode {
            --bg-dark: rgba(248, 250, 252, 0.95);
            --bg-card: rgba(255, 255, 255, 0.95);
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: rgba(0,0,0,0.15);
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; overflow: hidden; background-color: #000; }
        
        #map { width: 100%; height: 100vh; z-index: 1; }

        /* Controles do Leaflet */
        .leaflet-control-zoom { border: none !important; box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important; }
        .leaflet-control-zoom a { background-color: var(--bg-card) !important; color: var(--text-main) !important; border-color: var(--border-color) !important; }
        .leaflet-control-scale-line { background: var(--bg-card) !important; color: var(--text-main) !important; border-color: var(--border-color) !important; font-family: 'Inter', sans-serif; font-size: 11px; }
        .leaflet-control-layers { background: var(--bg-card) !important; color: var(--text-main) !important; border: 1px solid var(--border-color) !important; border-radius: 8px; font-family: 'Inter', sans-serif; }

        .north-arrow {
            position: absolute; top: 70px; right: 20px; width: 40px; height: 40px; z-index: 1000;
            background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .north-arrow svg { width: 24px; height: 24px; fill: var(--text-muted); }

        #coord-display {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--bg-dark); color: var(--text-main); font-family: 'Inter', monospace;
            font-size: 0.75rem; padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border-color);
            z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(12px); pointer-events: none;
        }
        #coord-display span { color: var(--text-muted); }

        /* Botão Mestre de Mostrar Sidebar */
        .menu-open-btn {
            position: absolute; top: 20px; left: 20px; z-index: 990;
            background: var(--bg-dark); color: var(--text-main); font-size: 1.5rem;
            border: 1px solid var(--border-color); border-radius: 8px;
            width: 45px; height: 45px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(12px);
        }
        .menu-open-btn:hover { color: var(--primary); }

        /* MENU LATERAL */
        #sidebar {
            position: absolute; top: 20px; left: 20px; width: 340px; max-height: calc(100vh - 40px);
            background: var(--bg-dark); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(74, 222, 128, 0.2); border-radius: 12px; z-index: 1000;
            display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            color: var(--text-main); overflow-y: auto; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
        }
        #sidebar.hidden { transform: translateX(-120%); opacity: 0; pointer-events: none; }

        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-track { background: transparent; }
        #sidebar::-webkit-scrollbar-thumb { background: rgba(150,150,150,0.3); border-radius: 4px; }

        /* Cabeçalho com Logo e Controles Tema/Fechar */
        .sidebar-header { padding: 25px 15px 15px; border-bottom: 1px solid var(--border-color); text-align: center; position: relative; }
        .theme-btn, .close-btn { position: absolute; top: 12px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; transition: color 0.2s; }
        .theme-btn { left: 15px; }
        .close-btn { right: 15px; }
        .theme-btn:hover, .close-btn:hover { color: var(--text-main); }
        
        .sidebar-logo { max-width: 140px; height: auto; display: block; margin: 0 auto 10px auto; }
        .sidebar-header h1 { margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--primary); }

        .section { padding: 15px; border-bottom: 1px solid var(--border-color); }
        .section-title { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; }

        .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .search-input {
            flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2); color: var(--text-main); font-family: 'Inter', sans-serif; font-size: 0.85rem;
        }
        body.light-mode .search-input { background: #fff; }
        .search-input::placeholder { color: #64748b; }
        .search-btn {
            background: var(--primary); color: #000; border: none; padding: 0 15px; border-radius: 6px;
            font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .search-btn:hover { background: var(--primary-hover); }

        /* Lista Expansível Principal */
        .accordion-btn {
            background: rgba(150,150,150,0.1); color: var(--text-main); cursor: pointer; padding: 12px; width: 100%;
            text-align: left; border: 1px solid var(--border-color); border-radius: 6px; outline: none;
            transition: 0.3s; font-weight: 600; font-size: 0.85rem; display: flex; justify-content: space-between;
        }
        .accordion-btn:hover { background: rgba(150,150,150,0.2); }
        .accordion-content {
            padding: 15px 10px; display: none; background: rgba(0,0,0,0.1); border: 1px solid var(--border-color);
            border-top: none; border-radius: 0 0 6px 6px; max-height: 250px; overflow-y: auto;
        }
        body.light-mode .accordion-content { background: #f8fafc; }
        .accordion-content::-webkit-scrollbar { width: 4px; }
        .accordion-content::-webkit-scrollbar-thumb { background: var(--text-muted); }

        /* Categorias e Checkboxes (Com ícone expansível) */
        .category-header { 
            font-size: 0.8rem; font-weight: 700; text-transform: uppercase; 
            padding-bottom: 4px; margin-bottom: 10px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
        }
        .category-header-group { display: flex; align-items: center; gap: 8px; flex: 1; }
        .category-header input[type="checkbox"] { cursor: pointer; width: 14px; height: 14px; }
        .category-header label { cursor: pointer; user-select: none; }
        
        .sub-accordion-btn { cursor: pointer; padding: 0 5px; font-size: 0.7rem; color: var(--text-muted); transition: 0.2s; }
        .sub-accordion-btn:hover { color: var(--text-main); }
        
        .farm-list-wrapper { padding-left: 22px; margin-bottom: 15px; }
        .farm-list-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.85rem; }
        .farm-list-item input[type="checkbox"] { cursor: pointer; }
        
        .chk-elegivel { accent-color: var(--elegivel); }
        .chk-inelegivel { accent-color: var(--inelegivel); }
        
        .farm-label { flex: 1; cursor: pointer; user-select: none; transition: color 0.2s; }
        .farm-label:hover { color: var(--primary); }
        .clickable-layer { cursor: pointer; user-select: none; transition: color 0.2s; }
        .clickable-layer:hover { color: var(--primary); }

        /* Análises */
        .insight-card {
            background: rgba(150,150,150,0.1); border-radius: 6px; padding: 10px;
            border-left: 3px solid; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
        }
        .insight-title-group { display: flex; flex-direction: column; }
        .insight-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        .insight-qtd { font-size: 1.25rem; font-weight: 700; line-height: 1.2; }
        .insight-qtd-total { color: var(--text-main); }
        .insight-data-group { text-align: right; display: flex; flex-direction: column; }
        .insight-area { font-size: 0.85rem; color: var(--text-main); font-weight: 500; }
        .insight-perc { font-size: 0.7rem; color: var(--text-muted); }

        /* Switches Globais */
        .layer-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 0.85rem; }
        .layer-info { display: flex; align-items: center; gap: 8px; }
        .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(150,150,150,0.3); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* POPUP Leaflet Adaptável */
        .leaflet-popup-content-wrapper { background: var(--bg-card) !important; color: var(--text-main) !important; border: 1px solid var(--border-color); border-radius: 8px; }
        .leaflet-popup-tip { background: var(--bg-card) !important; }
        .leaflet-popup-close-button { color: var(--text-muted) !important; }
        .popup-table { width: 100%; border-collapse: collapse; font-family: 'Inter', sans-serif;}
        .popup-table th, .popup-table td { padding: 8px; border-bottom: 1px solid var(--border-color); font-size: 12px; }
        .popup-table th { color: var(--text-muted); text-align: left; width: 40%;}
    </style>
</head>
<body>

    <div id="map"></div>
    
    <!-- Botão Flutuante para Mostrar o Sidebar -->
    <button class="menu-open-btn" onclick="toggleSidebar()" title="Mostrar Menu">☰</button>

    <div class="north-arrow" title="Norte Verdadeiro">
        <svg viewBox="0 0 24 24"><path d="M12 2L8 22L12 17L16 22L12 2Z"/></svg>
    </div>

    <div id="coord-display"><span>Lat:</span> -- <span>| Long:</span> --</div>

    <div id="sidebar">
        <div class="sidebar-header">
            <button class="theme-btn" onclick="toggleTheme()" title="Modo Claro / Escuro">☀️</button>
            <button class="close-btn" onclick="toggleSidebar()" title="Ocultar Menu">✖</button>
            <img src="LOGO.png" alt="Logo UFA" class="sidebar-logo">
            <h1>🌐 GEOPORTAL</h1>
        </div>

        <div class="section">
            <div class="section-title">Busca e Localização</div>
            <div class="search-row">
                <input type="text" id="input-busca-fazenda" class="search-input" placeholder="Cód. Fazenda ou Nome">
                <button class="search-btn" onclick="buscarFazenda()">Buscar</button>
            </div>
            <div class="search-row">
                <input type="text" id="input-busca-coord" class="search-input" placeholder="Lat, Long (ex: -21.2, -43.7)">
                <button class="search-btn" style="padding: 0 10px;" onclick="buscarCoordenada()">📍</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Camadas Operacionais</div>
            
            <div class="layer-item">
                <div class="layer-info">
                    <span style="display:inline-block; width:12px; height:12px; border:2px solid var(--elegivel);"></span>
                    <span style="display:inline-block; width:12px; height:12px; border:2px solid var(--inelegivel); margin-left:-5px;"></span>
                    <span class="clickable-layer" ondblclick="zoomToGrupo(grupoFazendas)" title="Duplo clique para focar">Fazendas (Elegibilidade)</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-todas-fazendas" checked onchange="toggleMasterFazendas(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <button class="accordion-btn" onclick="toggleAccordion()">LISTA DE FAZENDAS <span>▼</span></button>
            <div class="accordion-content" id="accordion-fazendas">
                
                <!-- Bloco Elegíveis -->
                <div class="category-header" style="color: var(--elegivel);">
                    <div class="category-header-group">
                        <input type="checkbox" id="chk-master-elegivel" class="chk-elegivel" checked onchange="toggleCategoria('ELEGÍVEL', this.checked)">
                        <label for="chk-master-elegivel">ELEGÍVEIS</label>
                    </div>
                    <span class="sub-accordion-btn" onclick="toggleSubList('list-elegiveis', this)">▼</span>
                </div>
                <div class="farm-list-wrapper" id="list-elegiveis"></div>
                
                <!-- Bloco Inelegíveis -->
                <div class="category-header" style="color: var(--inelegivel);">
                    <div class="category-header-group">
                        <input type="checkbox" id="chk-master-inelegivel" class="chk-inelegivel" checked onchange="toggleCategoria('INELEGÍVEL', this.checked)">
                        <label for="chk-master-inelegivel">INELEGÍVEIS</label>
                    </div>
                    <span class="sub-accordion-btn" onclick="toggleSubList('list-inelegiveis', this)">▼</span>
                </div>
                <div class="farm-list-wrapper" id="list-inelegiveis"></div>
                
                <!-- Bloco Indefinido (Oculto) -->
                <div id="wrapper-outros" style="display: none;">
                    <div class="category-header" style="color: var(--text-muted);">
                        <div class="category-header-group">
                            <input type="checkbox" id="chk-master-outros" checked onchange="toggleCategoria('OUTRO', this.checked)">
                            <label for="chk-master-outros">INDEFINIDO</label>
                        </div>
                        <span class="sub-accordion-btn" onclick="toggleSubList('list-outros', this)">▼</span>
                    </div>
                    <div class="farm-list-wrapper" id="list-outros"></div>
                </div>
            </div>

            <div class="layer-item" style="margin-top: 15px;">
                <div class="layer-info">
                    <span style="display:inline-block; width:12px; height:12px; background:rgba(16,185,129,0.5); border:1px solid #10b981;"></span>
                    <span class="clickable-layer" ondblclick="zoomToGrupo(layerConservacao)" title="Duplo clique para focar">Áreas de Conservação</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-conservacao" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="layer-item">
                <div class="layer-info">
                    <span style="display:inline-block; width:12px; height:12px; background:rgba(59,130,246,0.2); border:1px solid #3b82f6;"></span>
                    <span class="clickable-layer" ondblclick="zoomToGrupo(layerInfluencia)" title="Duplo clique para focar">Área de Influência</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-influencia" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Bloco de Análise Dinâmica -->
        <div class="section" style="border-bottom: none;">
            <div class="section-title">Análise Dinâmica (Visíveis)</div>
            
            <div class="insight-card" style="border-left-color: var(--text-muted);">
                <div class="insight-title-group">
                    <span class="insight-label">Total Visível</span>
                    <span class="insight-qtd insight-qtd-total" id="ins-total-qtd">0</span>
                </div>
                <div class="insight-data-group">
                    <span class="insight-area" id="ins-total-area">0.00 ha</span>
                    <span class="insight-perc">100% da área</span>
                </div>
            </div>

            <div class="insight-card" style="border-left-color: var(--elegivel);">
                <div class="insight-title-group">
                    <span class="insight-label">Elegíveis</span>
                    <span class="insight-qtd" id="ins-eleg-qtd" style="color: var(--elegivel);">0</span>
                </div>
                <div class="insight-data-group">
                    <span class="insight-area" id="ins-eleg-area">0.00 ha</span>
                    <span class="insight-perc" id="ins-eleg-perc">0% da área</span>
                </div>
            </div>

            <div class="insight-card" style="border-left-color: var(--inelegivel);">
                <div class="insight-title-group">
                    <span class="insight-label">Inelegíveis</span>
                    <span class="insight-qtd" id="ins-inel-qtd" style="color: var(--inelegivel);">0</span>
                </div>
                <div class="insight-data-group">
                    <span class="insight-area" id="ins-inel-area">0.00 ha</span>
                    <span class="insight-perc" id="ins-inel-perc">0% da área</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Definição de Mapas Base (Basemaps)
        var esriImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri' });
        var osmMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' });

        var map = L.map('map', { 
            zoomControl: false, zoomSnap: 0.25, zoomDelta: 0.5, wheelPxPerZoomLevel: 100,
            layers: [esriImagery] // Camada inicial
        }).setView([-10.0, -55.0], 5);
        
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.control.scale({ metric: true, imperial: false, position: 'bottomleft' }).addTo(map);

        // Seletor de Camadas (Canto superior direito)
        var baseMaps = {
            "Satélite (Atual)": esriImagery,
            "OpenStreetMap": osmMap
        };
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        // Funções de UI Adicionais (Tema e Menu Lateral)
        window.toggleSidebar = function() {
            var sidebar = document.getElementById("sidebar");
            sidebar.classList.toggle("hidden");
        };

        window.toggleTheme = function() {
            document.body.classList.toggle('light-mode');
            const btn = document.querySelector('.theme-btn');
            if (document.body.classList.contains('light-mode')) {
                btn.innerText = '🌙';
            } else {
                btn.innerText = '☀️';
            }
        };

        var coordDisplay = document.getElementById('coord-display');
        map.on('mousemove', function(e) { coordDisplay.innerHTML = `<span>Lat:</span> ${e.latlng.lat.toFixed(5)} <span>| Long:</span> ${e.latlng.lng.toFixed(5)}`; });

        var layerInfluencia, layerConservacao;
        var grupoFazendas = L.featureGroup().addTo(map);
        var dicionarioFazendas = {}; 
        var metadadosFazendas = {}; 

        var styleInfluencia = { color: "#3b82f6", weight: 2, opacity: 0.8, fillOpacity: 0.1, dashArray: '4 4' };
        var styleConservacao = { color: "#10b981", weight: 1.5, opacity: 1, fillColor: "#10b981", fillOpacity: 0.5 };

        function styleFazendas(feature) {
            var status = feature.properties && feature.properties.ELEGIBILIDADE ? String(feature.properties.ELEGIBILIDADE).trim().toUpperCase() : '';
            if (status === 'INELEGÍVEL' || status === 'INELEGIVEL') return { color: '#ef4444', weight: 2.5, fillOpacity: 0 };
            if (status === 'ELEGÍVEL' || status === 'ELEGIVEL') return { color: '#10b981', weight: 2.5, fillOpacity: 0 };
            return { color: '#94a3b8', weight: 1.5, fillOpacity: 0 };
        }

        function createPopup(feature, layer) {
            if (feature.properties) {
                let popupContent = '<table class="popup-table">';
                for (let key in feature.properties) {
                    popupContent += `<tr><th>${key}</th><td>${feature.properties[key]}</td></tr>`;
                }
                popupContent += '</table>';
                layer.bindPopup(popupContent);
            }
        }

        window.zoomToGrupo = function(grupo) {
            if (grupo && grupo.getBounds && Object.keys(grupo._layers).length > 0) {
                map.flyToBounds(grupo.getBounds(), { duration: 1.5, padding: [50, 50] });
            } else alert("Camada ainda está carregando ou está vazia.");
        };

        window.zoomToFazenda = function(idFazenda) {
            let layer = dicionarioFazendas[idFazenda];
            if (layer) {
                document.getElementById(`chk-${idFazenda}`).checked = true;
                toggleFazendaIndividual(idFazenda, true);
                let bounds = layer.getBounds();
                map.flyToBounds(bounds, { duration: 1.5, padding: [50, 50] });
                setTimeout(() => { layer.eachLayer(function(l) { l.openPopup(); }); }, 1500);
            }
        };

        function atualizarInsights() {
            let countTotal = 0, countElegivel = 0, countInelegivel = 0;
            let areaTotal = 0, areaElegivel = 0, areaInelegivel = 0;

            for (let id in metadadosFazendas) {
                let faz = metadadosFazendas[id];
                if (faz.visivel) {
                    countTotal++; areaTotal += faz.area;
                    if (faz.status === 'ELEGÍVEL') { countElegivel++; areaElegivel += faz.area; }
                    else if (faz.status === 'INELEGÍVEL') { countInelegivel++; areaInelegivel += faz.area; }
                }
            }

            let percElegivel = areaTotal > 0 ? ((areaElegivel / areaTotal) * 100).toFixed(1) : 0;
            let percInelegivel = areaTotal > 0 ? ((areaInelegivel / areaTotal) * 100).toFixed(1) : 0;

            document.getElementById('ins-total-qtd').innerText = countTotal;
            document.getElementById('ins-total-area').innerText = areaTotal.toFixed(2) + ' ha';
            
            document.getElementById('ins-eleg-qtd').innerText = countElegivel;
            document.getElementById('ins-eleg-area').innerText = areaElegivel.toFixed(2) + ' ha';
            document.getElementById('ins-eleg-perc').innerText = percElegivel + '% da área';

            document.getElementById('ins-inel-qtd').innerText = countInelegivel;
            document.getElementById('ins-inel-area').innerText = areaInelegivel.toFixed(2) + ' ha';
            document.getElementById('ins-inel-perc').innerText = percInelegivel + '% da área';
        }

        fetch('dados/fazendas.geojson').then(res => res.json()).then(data => {
                let contElegiveis = document.getElementById('list-elegiveis');
                let contInelegiveis = document.getElementById('list-inelegiveis');
                let contOutros = document.getElementById('list-outros');
                
                data.features.forEach((feature, index) => {
                    let idFazenda = feature.properties.NOME || feature.properties.CODIGO || feature.properties.nome || `Fazenda ${index + 1}`;
                    let layer = L.geoJSON(feature, { style: styleFazendas, onEachFeature: createPopup });
                    
                    dicionarioFazendas[idFazenda] = layer; grupoFazendas.addLayer(layer);

                    let pArea = feature.properties.AREA_KM2 || feature.properties.AREA || feature.properties.area_km2 || 0;
                    let status = feature.properties && feature.properties.ELEGIBILIDADE ? String(feature.properties.ELEGIBILIDADE).trim().toUpperCase() : 'OUTRO';
                    let flagStatus = (status === 'ELEGÍVEL' || status === 'ELEGIVEL') ? 'ELEGÍVEL' : (status === 'INELEGÍVEL' || status === 'INELEGIVEL' ? 'INELEGÍVEL' : 'OUTRO');

                    metadadosFazendas[idFazenda] = { status: flagStatus, area: parseFloat(pArea), visivel: true };
                    let chkClass = flagStatus === 'INELEGÍVEL' ? 'chk-inelegivel' : 'chk-elegivel';

                    let checkboxHTML = `
                        <div class="farm-list-item">
                            <input type="checkbox" id="chk-${idFazenda}" class="${chkClass}" checked onchange="toggleFazendaIndividual('${idFazenda}', this.checked)">
                            <label class="farm-label" for="chk-${idFazenda}" ondblclick="zoomToFazenda('${idFazenda}')">${idFazenda}</label>
                        </div>
                    `;

                    if (flagStatus === 'ELEGÍVEL') contElegiveis.insertAdjacentHTML('beforeend', checkboxHTML);
                    else if (flagStatus === 'INELEGÍVEL') contInelegiveis.insertAdjacentHTML('beforeend', checkboxHTML);
                    else { document.getElementById('wrapper-outros').style.display = 'block'; contOutros.insertAdjacentHTML('beforeend', checkboxHTML); }
                });
                
                let bounds = grupoFazendas.getBounds(); map.fitBounds(bounds);
                let limitBuffer = 2.0; 
                let maxBounds = L.latLngBounds(L.latLng(bounds.getSouth() - limitBuffer, bounds.getWest() - limitBuffer), L.latLng(bounds.getNorth() + limitBuffer, bounds.getEast() + limitBuffer));
                
                map.setMaxBounds(maxBounds);
                map.options.minZoom = map.getBoundsZoom(maxBounds);
                atualizarInsights();
            });

        fetch('dados/influencia.geojson').then(res => res.json()).then(data => { layerInfluencia = L.geoJSON(data, { style: styleInfluencia, onEachFeature: createPopup }).addTo(map); });
        fetch('dados/CONSERVACAO.geojson').then(res => res.json()).then(data => { layerConservacao = L.geoJSON(data, { style: styleConservacao, onEachFeature: createPopup }).addTo(map); });

        // Lógicas de Accordion
        window.toggleAccordion = function() {
            let content = document.getElementById("accordion-fazendas");
            content.style.display = content.style.display === "block" ? "none" : "block";
        };

        window.toggleSubList = function(listId, iconEl) {
            let listWrapper = document.getElementById(listId);
            if(listWrapper.style.display === "none") {
                listWrapper.style.display = "block";
                iconEl.innerText = "▼";
            } else {
                listWrapper.style.display = "none";
                iconEl.innerText = "▶";
            }
        };

        window.toggleCategoria = function(status, isChecked) {
            for (let idFazenda in metadadosFazendas) {
                if (metadadosFazendas[idFazenda].status === status) {
                    let checkbox = document.getElementById(`chk-${idFazenda}`);
                    if (checkbox && checkbox.checked !== isChecked) {
                        checkbox.checked = isChecked;
                        toggleFazendaIndividual(idFazenda, isChecked);
                    }
                }
            }
        };

        window.toggleFazendaIndividual = function(idFazenda, isChecked) {
            let layer = dicionarioFazendas[idFazenda];
            if (isChecked) grupoFazendas.addLayer(layer); else grupoFazendas.removeLayer(layer);
            if (metadadosFazendas[idFazenda]) metadadosFazendas[idFazenda].visivel = isChecked;
            atualizarInsights();
        };

        window.toggleMasterFazendas = function(isChecked) {
            for (let idFazenda in dicionarioFazendas) {
                let checkbox = document.getElementById(`chk-${idFazenda}`);
                if (checkbox) checkbox.checked = isChecked;
                let layer = dicionarioFazendas[idFazenda];
                if (isChecked) grupoFazendas.addLayer(layer); else grupoFazendas.removeLayer(layer);
                if (metadadosFazendas[idFazenda]) metadadosFazendas[idFazenda].visivel = isChecked;
            }
            document.getElementById('toggle-todas-fazendas').checked = isChecked;
            document.getElementById('chk-master-elegivel').checked = isChecked;
            document.getElementById('chk-master-inelegivel').checked = isChecked;
            if(document.getElementById('chk-master-outros')) document.getElementById('chk-master-outros').checked = isChecked;
            atualizarInsights();
        };

        window.buscarFazenda = function() {
            let termo = document.getElementById('input-busca-fazenda').value.toLowerCase().trim();
            if(!termo) return;
            for (let idFazenda in dicionarioFazendas) {
                if (idFazenda.toLowerCase().includes(termo)) {
                    zoomToFazenda(idFazenda);
                    return; 
                }
            }
            alert("Fazenda não encontrada.");
        };

        var tempMarker;
        window.buscarCoordenada = function() {
            let texto = document.getElementById('input-busca-coord').value;
            let partes = texto.split(',');
            if(partes.length === 2) {
                let lat = parseFloat(partes[0].trim()); let lng = parseFloat(partes[1].trim());
                if(!isNaN(lat) && !isNaN(lng)) {
                    if(tempMarker) map.removeLayer(tempMarker);
                    map.flyTo([lat, lng], 16, { duration: 1.5 });
                    tempMarker = L.marker([lat, lng]).addTo(map).bindPopup("Coordenada Pesquisada").openPopup();
                    return;
                }
            }
            alert("Formato inválido. Use: Latitude, Longitude (ex: -21.2, -43.7)");
        };

        document.getElementById('toggle-conservacao').addEventListener('change', function() { if(this.checked) map.addLayer(layerConservacao); else map.removeLayer(layerConservacao); });
        document.getElementById('toggle-influencia').addEventListener('change', function() { if(this.checked) map.addLayer(layerInfluencia); else map.removeLayer(layerInfluencia); });

    </script>
</body>
</html>
