<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOPORTAL - Análise Espacial Avançada</title>
    
    <!-- Fonte Google: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary: #4ade80; 
            --primary-hover: #22c55e;
            --bg-dark: rgba(15, 23, 20, 0.95);
            --bg-card: rgba(30, 41, 35, 0.95);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --elegivel: #10b981;
            --inelegivel: #ef4444;
            --border-color: rgba(255,255,255,0.1);
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; overflow: hidden; background-color: #000; }
        
        #map { width: 100%; height: 100vh; z-index: 1; }

        /* Controles do Leaflet (Zoom, Escala) */
        .leaflet-control-zoom { border: none !important; box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important; }
        .leaflet-control-zoom a { background-color: var(--bg-card) !important; color: var(--text-main) !important; border-color: #333 !important; }
        .leaflet-control-scale-line { background: rgba(30, 41, 35, 0.8) !important; color: #fff !important; border-color: rgba(255,255,255,0.5) !important; font-family: 'Inter', sans-serif; font-size: 11px; }

        /* Seta Norte Customizada */
        .north-arrow {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            z-index: 1000;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .north-arrow svg { width: 24px; height: 24px; fill: var(--text-muted); }

        /* MENU LATERAL */
        #sidebar {
            position: absolute; top: 20px; left: 20px; width: 340px; max-height: calc(100vh - 40px);
            background: var(--bg-dark); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(74, 222, 128, 0.2); border-radius: 12px; z-index: 1000;
            display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            color: var(--text-main); overflow-y: auto;
        }

        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-track { background: transparent; }
        #sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-color); text-align: center; }
        .sidebar-header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; color: var(--primary); }

        .section { padding: 15px; border-bottom: 1px solid var(--border-color); }
        .section-title { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; }

        /* Campos de Busca */
        .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .search-input {
            flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.3); color: #fff; font-family: 'Inter', sans-serif; font-size: 0.85rem;
        }
        .search-input::placeholder { color: #64748b; }
        .search-btn {
            background: var(--primary); color: #000; border: none; padding: 0 15px; border-radius: 6px;
            font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .search-btn:hover { background: var(--primary-hover); }

        /* Lista Expansível (Accordion) */
        .accordion-btn {
            background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; padding: 12px; width: 100%;
            text-align: left; border: 1px solid var(--border-color); border-radius: 6px; outline: none;
            transition: 0.3s; font-weight: 600; font-size: 0.85rem; display: flex; justify-content: space-between;
        }
        .accordion-btn:hover { background: rgba(255,255,255,0.1); }
        .accordion-content {
            padding: 10px; display: none; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color);
            border-top: none; border-radius: 0 0 6px 6px; max-height: 250px; overflow-y: auto;
        }
        .accordion-content::-webkit-scrollbar { width: 4px; }
        .accordion-content::-webkit-scrollbar-thumb { background: #555; }

        /* Botões de Ação em Massa */
        .mass-action-row { display: flex; gap: 5px; margin-bottom: 10px; }
        .mass-btn {
            flex: 1; padding: 6px; background: #334155; color: #fff; border: 1px solid var(--border-color);
            border-radius: 4px; cursor: pointer; font-size: 0.75rem; transition: 0.2s;
        }
        .mass-btn:hover { background: #475569; }

        /* Itens da Lista de Fazendas */
        .farm-list-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.85rem; }
        .farm-list-item input[type="checkbox"] { accent-color: var(--primary); cursor: pointer; }

        /* Switches Globais */
        .layer-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 0.85rem; }
        .layer-info { display: flex; align-items: center; gap: 8px; }
        .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.2); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* POPUP ESCURO ESTILO DARK MODE */
        .leaflet-popup-content-wrapper { background: var(--bg-card) !important; color: var(--text-main) !important; border: 1px solid var(--border-color); border-radius: 8px; }
        .leaflet-popup-tip { background: var(--bg-card) !important; }
        .leaflet-popup-close-button { color: var(--text-muted) !important; }
        .popup-table { width: 100%; border-collapse: collapse; font-family: 'Inter', sans-serif;}
        .popup-table th, .popup-table td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 12px; }
        .popup-table th { color: var(--text-muted); text-align: left; width: 40%;}
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Seta Norte -->
    <div class="north-arrow" title="Norte Verdadeiro">
        <svg viewBox="0 0 24 24"><path d="M12 2L8 22L12 17L16 22L12 2Z"/></svg>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1>🌐 GEOPORTAL</h1>
        </div>

        <div class="section">
            <div class="section-title">Busca e Localização</div>
            
            <div class="search-row">
                <input type="text" id="input-busca-fazenda" class="search-input" placeholder="Cód. Fazenda ou Nome">
                <button class="search-btn" onclick="buscarFazenda()">Buscar</button>
            </div>

            <div class="search-row">
                <input type="text" id="input-busca-coord" class="search-input" placeholder="Lat, Long (ex: -21.2, -43.7)">
                <button class="search-btn" style="padding: 0 10px;" onclick="buscarCoordenada()">📍</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Camadas Operacionais</div>
            
            <!-- Controle Mestre das Fazendas -->
            <div class="layer-item">
                <div class="layer-info">
                    <span style="display:inline-block; width:12px; height:12px; border:2px solid var(--elegivel);"></span>
                    <span style="display:inline-block; width:12px; height:12px; border:2px solid var(--inelegivel); margin-left:-5px;"></span>
                    <span>Fazendas (Elegibilidade)</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-todas-fazendas" checked onchange="toggleMasterFazendas(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Lista Expansível de Fazendas -->
            <button class="accordion-btn" onclick="toggleAccordion()">📁 LISTA DE FAZENDAS <span>▼</span></button>
            <div class="accordion-content" id="accordion-fazendas">
                <div class="mass-action-row">
                    <button class="mass-btn" onclick="marcarTodasLista(true)">Marcar Todos</button>
                    <button class="mass-btn" onclick="marcarTodasLista(false)">Desmarcar</button>
                </div>
                <div id="farm-list-container">
                    <!-- Checkboxes injetados via JS -->
                </div>
            </div>

            <div class="layer-item" style="margin-top: 15px;">
                <div class="layer-info">
                    <span style="display:inline-block; width:12px; height:12px; background:rgba(16,185,129,0.5); border:1px solid #10b981;"></span>
                    <span>Áreas de Conservação</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-conservacao" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="layer-item">
                <div class="layer-info">
                    <span style="display:inline-block; width:12px; height:12px; background:rgba(59,130,246,0.2); border:1px solid #3b82f6;"></span>
                    <span>Área de Influência</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-influencia" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. INICIALIZAÇÃO DO MAPA COM ZOOM SUAVE
        var map = L.map('map', { 
            zoomControl: false,
            zoomSnap: 0.25,      // Permite zooms fracionados mais suaves
            zoomDelta: 0.5,      // Velocidade do giro do mouse
            wheelPxPerZoomLevel: 100 // Sensibilidade da roda do mouse
        }).setView([-10.0, -55.0], 5);
        
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        
        // Adiciona a barra de Escala (canto inferior esquerdo)
        L.control.scale({ metric: true, imperial: false, position: 'bottomleft' }).addTo(map);

        // 2. MAPAS DE FUNDO
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri' }).addTo(map);

        // 3. VARIÁVEIS GLOBAIS
        var layerInfluencia, layerConservacao;
        var grupoFazendas = L.featureGroup().addTo(map); // Grupo que controla todas as fazendas
        var dicionarioFazendas = {}; // Guarda a referência individual de cada fazenda (layer)

        // Estilos
        var styleInfluencia = { color: "#3b82f6", weight: 2, opacity: 0.8, fillOpacity: 0.1, dashArray: '4 4' };
        var styleConservacao = { color: "#10b981", weight: 1.5, opacity: 1, fillColor: "#10b981", fillOpacity: 0.5 };

        function styleFazendas(feature) {
            var status = feature.properties && feature.properties.ELEGIBILIDADE ? String(feature.properties.ELEGIBILIDADE).trim().toUpperCase() : '';
            if (status === 'INELEGÍVEL' || status === 'INELEGIVEL') return { color: '#ef4444', weight: 2.5, fillOpacity: 0 };
            if (status === 'ELEGÍVEL' || status === 'ELEGIVEL') return { color: '#10b981', weight: 2.5, fillOpacity: 0 };
            return { color: '#94a3b8', weight: 1.5, fillOpacity: 0 };
        }

        // Popup Dinâmico
        function createPopup(feature, layer) {
            if (feature.properties) {
                let popupContent = '<table class="popup-table">';
                for (let key in feature.properties) {
                    popupContent += `<tr><th>${key}</th><td>${feature.properties[key]}</td></tr>`;
                }
                popupContent += '</table>';
                layer.bindPopup(popupContent);
            }
        }

        // 4. CARREGAMENTO DOS DADOS (FAZENDAS INDIVIDUAIS)
        fetch('dados/fazendas.geojson')
            .then(res => res.json())
            .then(data => {
                let listContainer = document.getElementById('farm-list-container');
                
                data.features.forEach((feature, index) => {
                    // Tenta identificar o nome ou código da fazenda; se não houver, usa índice numérico
                    let idFazenda = feature.properties.NOME || feature.properties.CODIGO || feature.properties.nome || feature.properties.codigo || `Fazenda ${index + 1}`;
                    
                    // Cria a camada (layer) individual para essa fazenda
                    let layer = L.geoJSON(feature, { style: styleFazendas, onEachFeature: createPopup });
                    
                    // Salva no dicionário e adiciona ao grupo mestre
                    dicionarioFazendas[idFazenda] = layer;
                    grupoFazendas.addLayer(layer);

                    // Cria o item da lista de checkbox na barra lateral
                    let checkboxHTML = `
                        <div class="farm-list-item">
                            <input type="checkbox" id="chk-${idFazenda}" checked onchange="toggleFazendaIndividual('${idFazenda}', this.checked)">
                            <label for="chk-${idFazenda}">${idFazenda}</label>
                        </div>
                    `;
                    listContainer.insertAdjacentHTML('beforeend', checkboxHTML);
                });
                map.fitBounds(grupoFazendas.getBounds());
            });

        // Carrega Área de Influência
        fetch('dados/influencia.geojson').then(res => res.json()).then(data => {
            layerInfluencia = L.geoJSON(data, { style: styleInfluencia, onEachFeature: createPopup }).addTo(map);
        });

        // Carrega Conservação
        fetch('dados/CONSERVACAO.geojson').then(res => res.json()).then(data => {
            layerConservacao = L.geoJSON(data, { style: styleConservacao, onEachFeature: createPopup }).addTo(map);
        });

        // 5. LÓGICA DE CONTROLE DA LISTA E DOS BOTÕES

        // Liga/Desliga fazenda individual
        function toggleFazendaIndividual(idFazenda, isChecked) {
            let layer = dicionarioFazendas[idFazenda];
            if (isChecked) {
                grupoFazendas.addLayer(layer);
            } else {
                grupoFazendas.removeLayer(layer);
            }
        }

        // Marcar/Desmarcar todas na lista (Accordion)
        function marcarTodasLista(marcar) {
            for (let idFazenda in dicionarioFazendas) {
                let checkbox = document.getElementById(`chk-${idFazenda}`);
                if (checkbox) checkbox.checked = marcar;
                toggleFazendaIndividual(idFazenda, marcar);
            }
            // Sincroniza o botão mestre global
            document.getElementById('toggle-todas-fazendas').checked = marcar;
        }

        // Toggle Mestre (Switch fora do Accordion)
        function toggleMasterFazendas(isChecked) {
            marcarTodasLista(isChecked);
        }

        // Abre/Fecha o Accordion
        function toggleAccordion() {
            let content = document.getElementById("accordion-fazendas");
            content.style.display = content.style.display === "block" ? "none" : "block";
        }

        // 6. SISTEMAS DE BUSCA
        
        // Buscar por Nome/Código
        function buscarFazenda() {
            let termo = document.getElementById('input-busca-fazenda').value.toLowerCase().trim();
            if(!termo) return;

            for (let idFazenda in dicionarioFazendas) {
                if (idFazenda.toLowerCase().includes(termo)) {
                    let layer = dicionarioFazendas[idFazenda];
                    
                    // Garante que a fazenda está visível
                    document.getElementById(`chk-${idFazenda}`).checked = true;
                    toggleFazendaIndividual(idFazenda, true);

                    // Voa suavemente (flyToBounds) até a fazenda e abre o popup
                    let bounds = layer.getBounds();
                    map.flyToBounds(bounds, { duration: 1.5 });
                    
                    // Espera a animação terminar para abrir o popup
                    setTimeout(() => {
                        layer.eachLayer(function(l) { l.openPopup(); });
                    }, 1500);
                    return; // Para no primeiro que encontrar
                }
            }
            alert("Fazenda não encontrada.");
        }

        // Buscar por Coordenadas (Marcador Temporário)
        var tempMarker;
        function buscarCoordenada() {
            let texto = document.getElementById('input-busca-coord').value;
            // Tenta quebrar o texto por vírgula
            let partes = texto.split(',');
            if(partes.length === 2) {
                let lat = parseFloat(partes[0].trim());
                let lng = parseFloat(partes[1].trim());

                if(!isNaN(lat) && !isNaN(lng)) {
                    // Limpa marcador anterior se houver
                    if(tempMarker) map.removeLayer(tempMarker);
                    
                    // Voo suave e adiciona pino
                    map.flyTo([lat, lng], 16, { duration: 1.5 });
                    tempMarker = L.marker([lat, lng]).addTo(map).bindPopup("Coordenada Pesquisada").openPopup();
                    return;
                }
            }
            alert("Formato inválido. Use: Latitude, Longitude (ex: -21.2, -43.7)");
        }

        // Toggles das outras camadas
        document.getElementById('toggle-conservacao').addEventListener('change', function() {
            if(this.checked) map.addLayer(layerConservacao); else map.removeLayer(layerConservacao);
        });
        document.getElementById('toggle-influencia').addEventListener('change', function() {
            if(this.checked) map.addLayer(layerInfluencia); else map.removeLayer(layerInfluencia);
        });

    </script>
</body>
</html>
