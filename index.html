<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS - Monitoramento Ambiental</title>
    
    <!-- Importando o CSS do Leaflet para o visual do mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Reset básico e configuração de tela cheia */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #map {
            width: 100%;
            height: 100vh; /* Ocupa 100% da tela */
        }

        /* Estilização da caixa do controle de camadas para ficar mais profissional */
        .leaflet-control-layers {
            border-radius: 8px !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2) !important;
            padding: 6px !important;
            background: rgba(255, 255, 255, 0.95) !important;
        }
        
        /* Personalização do Pop-up */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .leaflet-popup-content {
            margin: 15px;
            font-size: 13px;
        }
        .popup-table {
            width: 100%;
            border-collapse: collapse;
        }
        .popup-table th, .popup-table td {
            padding: 5px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }
        .popup-table th {
            color: #555;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Importando o Javascript do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. INICIALIZAÇÃO DO MAPA
        // Coordenadas iniciais centralizadas no Brasil (ajuste conforme a área dos seus dados)
        var map = L.map('map').setView([-10.0, -55.0], 5);

        // 2. MAPAS BASE (BASEMAPS)
        // Mapa de Satélite (Google)
        var googleSat = L.tileLayer('http://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{
            maxZoom: 20,
            subdomains:['mt0','mt1','mt2','mt3'],
            attribution: '© Google Satellite'
        });

        // Mapa Claro/Clean (CartoDB Positron - excelente para destacar dados vetoriais)
        var cartoLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CARTO',
            maxZoom: 20
        }).addTo(map); // Definido como padrão ao abrir

        // 3. FUNÇÃO PARA CRIAR POP-UPS DINÂMICOS
        // Essa função lê os atributos do seu GeoJSON do QGIS e monta uma tabela HTML
        function onEachFeature(feature, layer) {
            if (feature.properties) {
                let popupContent = '<table class="popup-table">';
                for (let key in feature.properties) {
                    popupContent += `<tr><th>${key}</th><td>${feature.properties[key]}</td></tr>`;
                }
                popupContent += '</table>';
                layer.bindPopup(popupContent);
            }
        }

        // 4. ESTILOS DAS CAMADAS
        var styleConservacao = { color: "#2E8B57", weight: 2, opacity: 1, fillColor: "#3CB371", fillOpacity: 0.5 };
        var styleFazendas = { color: "#D2691E", weight: 2, opacity: 1, fillColor: "#CD853F", fillOpacity: 0.4 };
        var styleInfluencia = { color: "#4169E1", weight: 3, opacity: 0.8, dashArray: '5, 10', fill: false };

        // 5. CARREGAMENTO DOS DADOS GEOJSON VIA FETCH API
        // Criando grupos de camadas vazios para adicionar ao controle
        var conservacaoLayer = L.layerGroup();
        var fazendasLayer = L.layerGroup();
        var influenciaLayer = L.layerGroup();

        // Carregar CONSERVACAO.geojson
        fetch('dados/CONSERVACAO.geojson')
            .then(res => res.json())
            .then(data => {
                var layer = L.geoJSON(data, { style: styleConservacao, onEachFeature: onEachFeature });
                conservacaoLayer.addLayer(layer);
                conservacaoLayer.addTo(map); // Adiciona ligado por padrão
                map.fitBounds(layer.getBounds()); // Dá zoom automático para a área dos dados
            })
            .catch(err => console.error("Erro ao carregar Conservação:", err));

        // Carregar fazendas.geojson
        fetch('dados/fazendas.geojson')
            .then(res => res.json())
            .then(data => {
                var layer = L.geoJSON(data, { style: styleFazendas, onEachFeature: onEachFeature });
                fazendasLayer.addLayer(layer);
                fazendasLayer.addTo(map); // Adiciona ligado por padrão
            })
            .catch(err => console.error("Erro ao carregar Fazendas:", err));

        // Carregar influencia.geojson
        fetch('dados/influencia.geojson')
            .then(res => res.json())
            .then(data => {
                var layer = L.geoJSON(data, { style: styleInfluencia, onEachFeature: onEachFeature });
                influenciaLayer.addLayer(layer);
                influenciaLayer.addTo(map); // Adiciona ligado por padrão
            })
            .catch(err => console.error("Erro ao carregar Influência:", err));

        // 6. CONTROLE DE CAMADAS (Ligar e Desligar)
        var baseMaps = {
            "Mapa Limpo (CartoDB)": cartoLight,
            "Imagem de Satélite (Google)": googleSat
        };

        var overlayMaps = {
            "<span style='color:#2E8B57; font-weight:bold;'>🟩 Áreas de Conservação</span>": conservacaoLayer,
            "<span style='color:#D2691E; font-weight:bold;'>🟧 Fazendas</span>": fazendasLayer,
            "<span style='color:#4169E1; font-weight:bold;'>🟦 Área de Influência</span>": influenciaLayer
        };

        // Adiciona o painel de controle no canto superior direito
        L.control.layers(baseMaps, overlayMaps, {collapsed: false}).addTo(map);

    </script>
</body>
</html>
